# This workflow will build and deploy using Cloud Run.

name: Cloud Run Continuous Deployment

on:
  push:
    # Detached from the team's shared deployment on purpose — this fork
    # (P-dilasha-004/code-and-conquer) should never auto-deploy to the
    # shared daniel-reyes-uprm project. Re-enable ('none' -> 'main', or a
    # dedicated branch of your choosing) only after filling in your own
    # setup.sh output below, once PERSONAL_DEPLOY.md step 1 is done.
    branches: 'none'
  release:
    types: [published]

env:
  # TODO: Paste output from YOUR OWN setup.sh run below (see
  # PERSONAL_DEPLOY.md) — do not reuse the team's daniel-reyes-uprm values.
  PROJECT_ID: 'TODO-your-own-gcp-project-id'
  SERVICE_NAME: 'TODO-your-own-service-name'
  SERVICE_REGION: 'us-central1'
  SERVICE_ACCOUNT: 'TODO-your-own-project-number-compute@developer.gserviceaccount.com'
  WORKLOAD_IDENTITY_PROVIDER: 'TODO-your-own-workload-identity-provider'

jobs:
  py-checks:
    uses: ./.github/workflows/python-checks.yml
    
  build-deploy:
    name: 'Build and deploy using Cloud Run'
    runs-on: ubuntu-latest
    needs: py-checks

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: 'actions/checkout@v4'
    # Authorize GitHub to connect to your service account
    - uses: 'google-github-actions/auth@v2'
      with:
        project_id: '${{ env.PROJECT_ID }}'
        workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER}}'
        service_account: '${{ env.SERVICE_ACCOUNT }}'
    
    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'
      with:
        project_id: '${{ env.PROJECT_ID }}'
        version: '>= 363.0.0'

    - name: 'Configure docker for GCP'
      run: 'gcloud auth configure-docker'

    - name: 'Build and push Docker image'
      uses: 'docker/build-push-action@v5'
      with:
        context: .
        push: true
        tags: 'gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}'

    - id: 'Deploy'
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        service: '${{ env.SERVICE_NAME }}'
        image: 'gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest'
        region: '${{ env.SERVICE_REGION }}'

    - name: 'Display deployed app URL'
      run: 'curl "${{ steps.deploy.outputs.url }}"'
